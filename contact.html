<main>
<div class="form-card">
<form action="process-booking.php" method="post">
<div class="form-field"><label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" required></div><br>

<div class="form-field"><label for="email">Email:</label>
<input type="email" id="email" name="email" required></div><br>

<div class="form-field"><label for="tel">Telephone:</label>
<input type="tel" id="tel" name="tel" required></div><br>

<div class="form-field"><label for="date">Preferred Consultation Date</label>
<input type="date" id="date" name="date"></div><br>

<div class="form-field"><p>Consultation Type</p>
<input type="radio" id="virtual" name="consultationtype" value="Virtual">
<label for="virtual" class="inline-label">Virtual</label>

<input type="radio" id="inperson" name="consultationtype" value="In-person">
<label for="inperson" class="inline-label">In-person</label></div><br>

<div class="form-field"><p>Services of interest</p>
<input type="checkbox" id="scheduleauditing" name="servicesofinterest[]" value="Pre-Award Schedule Auditing">
<label for="scheduleauditing" class="inline-label">Pre-Award Schedule Auditing</label>

<input type="checkbox" id="projectcontrolsandevm" name="servicesofinterest[]" value="Project Controls and EVM">
<label for="projectcontrolsandevm" class="inline-label">Project Controls &amp; Earned Value Management</label>

<input type="checkbox" id="independentsiteandqualityoversight" name="servicesofinterest[]" value="Independent Site and Quality Oversight">
<label for="independentsiteandqualityoversight" class="inline-label">Independent Site &amp; Quality Oversight</label>

<input type="checkbox" id="claimsanddelayanalysis" name="servicesofinterest[]" value="Claims and Delay Analysis">
<label for="claimsanddelayanalysis" class="inline-label">Claims &amp; Delay Analysis</label></div><br>

<div class="form-field"><label for="status">Project Status</label>
<select id="status" name="status">
<option value="">--Select--</option>
<option value="Planning">Planning stage</option>
<option value="Starting soon">Starting soon</option>
<option value="In progress">In progress</option>
</select></div><br>

<label for="projectdetails">Project Details: </label>
<textarea id="projectdetails" name="projectdetails" rows="6" cols="50"></textarea><br>

<button type="submit">Submit</button>
<button type="reset">Clear Form</button>

</form>
